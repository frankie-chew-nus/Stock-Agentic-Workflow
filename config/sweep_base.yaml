# sweep_base.yaml - layer 1 of 3 for news-sweep prompts (base -> sector -> company).
# Everything here applies to every company. Sectors and companies ADD to lists and can
# OVERRIDE single values (see build_sweep_prompt.py for the merge rules).
#
# Placeholders usable in any text field: {company}, {short_name}, {code}, {mention_name},
# {venue_note} (company field, e.g. "(including cruise terminal events at ...)"; empty if unset)

defaults:
  cap: 50              # max articles per sweep; --cap 0 means no cap
  former_name_grace_days: 365   # keep searching a former name this long after it stopped being used

# Trusted for every sweep. Sector and company files add their own (regulators, trade press,
# company newsroom).
trusted_domains:
  - businesstimes.com.sg
  - straitstimes.com
  - channelnewsasia.com
  - theedgesingapore.com
  - reuters.com
  - bloomberg.com
  - ft.com
  - wsj.com
  - asia.nikkei.com
  - cnbc.com
  - sgx.com
  - judiciary.gov.sg
  - moodys.com
  - spglobal.com
  - fitchratings.com
  - sg.finance.yahoo.com

# Bucket LETTERS are fixed across the whole universe so search_bucket is comparable.
# Sectors and companies override the description, not the letter.
buckets:
  a: "Results and guidance: earnings, revenue, margins, dividends, guidance and outlook statements"
  b: "Legal and regulatory: regulators, penalties, lawsuits, court cases, compliance, incidents and outages"
  c: "Leadership and governance: appointments, succession, board changes, executive comments on {short_name}'s own business"
  d: "Strategy and deals: acquisitions, divestments, partnerships, joint ventures, expansion, buybacks"
  e: "Credit and capital: rating actions, bond or note issues, refinancing, gearing, capital raising"
  f: "Products, operations and technology: major product launches, operations, technology and AI initiatives with business impact"
  g: "Sector stories: industry developments where {short_name} is discussed in its own right, including alongside peers"
  h: "Primary sources: SGX announcements, the {short_name} newsroom, regulator statements, rating agency releases"

# "NOT relevant, even though X is named" - sector and company patterns are listed BEFORE these.
not_relevant_patterns:
  - "{short_name} hosts, sponsors or is the venue of an event{venue_note}, and the story is about something else."
  - "A {short_name} executive appears only as host, moderator, panellist on a general topic or interviewer."
  - "{short_name} appears in a list, a ranking, an award roundup, or as one example among many."
  - "The name appears only in a photo caption, video title or \"related stories\" text."
  - "The name matches an unrelated entity (see the collisions above)."

# "ARE relevant" examples - sector and company examples are listed BEFORE these.
relevant_examples:
  - "results and guidance"
  - "M&A"
  - "lawsuits and regulatory action involving {short_name}"
  - "management changes"
  - "credit rating actions"
  - "major product or strategy announcements"
  - "{short_name} executives commenting on {short_name}'s own business"

skip_reasons: [untrusted_domain, out_of_window, duplicate, unrelated_entity, fetch_failed]

output_fields: [url, title, source, author, published_date, date_confidence, source_notes,
                search_query, search_bucket, full_text, content, summary, summary_basis, evidence,
                prominence, mention_role, relevant, matched_tickers, confidence, reason]
