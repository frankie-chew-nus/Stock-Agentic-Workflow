# llm.yaml - which LLM tags the news articles (llm_article_tagger.py), via OpenRouter.
#
# To switch model, change `model` below (any id from https://openrouter.ai/models; free ones end
# in ":free"). Or try one without editing:  python llm_article_tagger.py --model <id>
# Articles are re-tagged automatically when the model or the prompt version changes.
#
# The API key is NOT stored here: it is read from OPENROUTER_API_KEY, normally set in a .env file
# in the project folder (same as in the NLP scraping project - copy that .env across).
#
# OpenRouter free-model limits (docs, Oct 2026) count REQUESTS, not tokens: 20 requests/minute;
# 50 requests/day if you have bought fewer than 10 credits in total, 1,000/day with 10+ credits.
# One article = one request normally (a second one if the reply is cut off at the token cap).
#
# Free variants can be retired without notice (minimax/minimax-m3.1-flash:free was retired on
# 22 Oct 2026). Each run first checks OpenRouter's public model list and skips any model here that
# is no longer listed (MODEL_NOT_LISTED in the run log).

provider: openrouter

# Active model. Matched gpt-4o-mini's relevance calls on the DBS test articles (NLP scraping, Oct 2026).
model: nvidia/nemotron-3-ultra-550b-a55b:free

# Tried in order for an article when the active model is rate-limited, unavailable or errors.
# nemotron-3.5-super-vl: free, tool calling + reasoning, no expiry listed (checked 23 Oct 2026). It is
# also served by NVIDIA, so an NVIDIA outage can hit both; another free option with tool calling is
# xingchen-agi/xing4.0-29b-a4b:free (untested on these articles).
fallback_models:
  - nvidia/nemotron-3.5-super-vl:free

temperature: 0

# Token cap per reply. It is a ceiling, not a target: normal articles use 400-1,400 output tokens.
# Nemotron's hidden reasoning counts against it - at 1,500, long or ambiguous articles were cut off
# before the answer (finish_reason "length").
max_reply_tokens: 4000
# A reply still cut off at max_reply_tokens is retried ONCE with this cap (then the next model).
length_retry_max_tokens: 8000
# Optional cap on hidden reasoning, sent as OpenRouter's `reasoning: {max_tokens: ...}` (models that
# do not support it ignore it). Leaves room for the answer inside max_reply_tokens. Remove to disable.
#reasoning_max_tokens: 2500

max_article_chars: 12000      # longer articles are cut (flagged text_may_be_truncated)
timeout_s: 240                # per call; scaled up with the cap for the length retry (~35 tokens/s on free Nemotron)
delay_between_calls_s: 0.2    # minimum gap between call STARTS (keeps under 20 requests/minute)
max_calls_per_run: 100         # 1000 free api calls a day
retries_per_model: 2          # extra attempts on 429 / 5xx / timeouts before moving to the next model
# Circuit breaker: after this many upstream errors IN A ROW from one model (across articles) - e.g.
# "Upstream error from Nvidia: Internal server error", 5xx, timeouts - that model is skipped for the rest
# of the run and articles go straight to the next one.
circuit_breaker_errors: 3
# Stop the run (status FAILED, ERROR NO_USABLE_MODEL) when this many articles in a row get no usable
# output from any model - or as soon as every model has been skipped.
max_consecutive_failed_articles: 3
