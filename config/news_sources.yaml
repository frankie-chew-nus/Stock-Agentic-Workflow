# news_sources.yaml - candidate news sources and RSS feeds for the news collector.
# Compiled 2026-10-22 by Claude from feed directories (Feedspot, Feeder), publisher RSS pages and
# direct reads of live feeds. Run a feed check from YOUR computer before relying on any entry:
# several outlets refuse Claude's cloud tools but work fine from a normal connection.
#
# feed status:
#   verified        - Claude read the live feed on 2026-10-22 and it had items dated 20-22 Oct 2026
#   listed          - published by the outlet or listed in a feed directory; not read by Claude
#   listed_broken   - a directory reports it not responding / stopped posting
#   stale           - readable, but the newest item was months old when checked
#   pattern         - likely URL by the site's platform convention (e.g. WordPress /feed/); untested
#   none_found      - no public RSS found; use the fallback (sitemap / newsroom page / email alerts)
#   robots_disallowed - the site's robots.txt refuses automated fetching of this feed (not polled)
# discover_sitemaps: true = rss_news_collector.py also polls the Google News sitemaps listed in
#   the site's robots.txt (recent articles with titles).
# blocked_here: true = Claude's cloud tools could not read the site (blocked, robots or error);
#   this says nothing about access from your own machine.
#
# trust (how the tagging step should treat it, independent of RSS):
#   A - primary source or major news organisation (most are already in sweep_base trusted_domains)
#   B - reputable trade or regional press
#   C - commentary, blogs, aggregators: discovery only, not evidence
# paywall: none | metered | hard
# sectors: sector names from config/sectors/*.yaml, or [all]
# in_sweep_trusted: domain is already in sweep_base.yaml or a sector trusted_domains list
#
# Use for personal research: respect each site's robots.txt and terms, poll at most a few times a
# day, cache results, and keep full text local.

