# briefing.yaml - settings for build_briefing.py (the synthesis-agent briefing: prices + news tags +
# fundamentals + the agent's own earlier views -> one prompt, and the decision ledger it feeds).
#
# Layers, applied in this order (later wins):
#   1. defaults built into build_briefing.py (any key left out here keeps its default)
#   2. the top-level sections below
#   3. overrides.<CODE>          per-stock settings (e.g. a wider band for a volatile stock)
#   4. profiles.<name>           an experiment, chosen with --profile <name>
#   5. --set key.path=value      one-off from the command line, e.g. --set news.min_materiality=high
# The effective config and its hash are saved in each briefing's .meta.json, and ledger entries are
# kept per profile, so runs with different settings never mix their memory or their scores.

# --------------------------------------------------------------------------------------------
# What is being predicted
# --------------------------------------------------------------------------------------------
label:
  horizon_trading_days: 20
  band_pct: 3.0                 # BUY / SELL = 20d excess return vs the STI beyond +/- this many %
  benchmark: "^STI"

technicals:
  base_rate_years: 5            # history used for the base rates of the three buckets
  weekly_closes: 12
  min_history_rows: 210         # warn below this (200-day MA and 52-week range need ~1 year)

# --------------------------------------------------------------------------------------------
# Fundamentals (data/fundamentals/fundamentals_<kpi_set>.csv from run_fundamentals_extraction.py)
# --------------------------------------------------------------------------------------------
fundamentals:
  n_quarters: 8                 # periods shown in the table (released on or before the as-of date)
  guidance_quarters: 4          # periods whose guidance text is quoted
  show_changes: true            # latest period vs the one before and vs a year earlier
  exclude_columns: []           # KPI columns to leave out of the table, e.g. [wm_fees_sgd_m]
  stale_after_days: 120         # warn when the latest release is older than this
  estimate_next_release: true   # next results date = same period's release date last year + 52 weeks

# --------------------------------------------------------------------------------------------
# News (data/news/llm_tags/ticker_tags/<CODE>.jsonl from llm_article_tagger.py)
# Levels: materiality high > medium > low > none; prominence main_subject > substantial > passing > none
# --------------------------------------------------------------------------------------------
news:
  lookback_days: 120

  # Main list: an item is shown in full only if it passes ALL of these.
  min_materiality: medium
  min_prominence: substantial
  min_tag_confidence: 0.5       # the tagger's own confidence in its call
  require_relevant_flag: true   # also require the tagger's final relevant=true (after its code-side rules)
  require_evidence_verified: false   # true = drop items whose evidence quote was not found in the text
  exclude_sponsored: true
  accepted_prompt_versions: []  # e.g. [tag-v6-research]; empty = accept tags from any prompt version

  max_items: 25                 # cap on the main list (oldest dropped first)
  max_opinion: 5                # cap on commentary / aggregator items inside the main list
  order: newest_first           # newest_first | oldest_first
  show_reasons: true            # print the tagger's relevance / sentiment reasons under each item
  dedupe_similarity: 0.3        # same story from several outlets (same event type, within 2 days, word
                                # overlap of title + summary >= this) -> shown and counted once, with
                                # "also reported by"; 0 = off. 0.3 merged the three DBS PayLah-in-Taiwan
                                # stories without merging different stories on the same day.

  # Low-materiality headlines, listed one line each as context (not evidence).
  context_list:
    enabled: true
    min_materiality: low
    max_items: 8

  # <news_signal>: mechanical aggregates of the tags. weight = materiality_weight x tag confidence
  # x 0.5 ** (age_days / half_life_days); sentiment = weighted mean of sentiment_score.
  signal_min_materiality: low   # items counted in the signal (prominence / confidence filters as above)
  half_life_days: 14
  signal_windows_days: [7, 30, 90]
  materiality_weight: {high: 1.0, medium: 0.5, low: 0.2, none: 0.0}

  # Source type (config/news_sources.yaml) -> evidence tier shown to the agent.
  source_tiers:
    exchange: primary
    regulator: primary
    company: primary
    news: news
    wire: news
    trade: news
    commentary: opinion
    aggregator: opinion

  # Market-wide stories, used only if the tagger tracks the index (watchlist include_index: true).
  market_context:
    enabled: true
    code: STI
    max_items: 5

  stale_collection_days: 3      # warn when the newest collected article (any stock) is older than this

# --------------------------------------------------------------------------------------------
# Analyst consensus (data/analyst/ from analyst_snapshot_collector.py, run daily)
# Yahoo only gives TODAY's price targets and the last few months of recommendation counts, so the
# collector keeps a dated snapshot per day and the briefing uses the one valid on the as-of date.
# --------------------------------------------------------------------------------------------
analyst:
  enabled: true                 # false = no <analyst_consensus> block and no analyst rule in the prompt
  dir: data/analyst
  max_snapshot_age_days: 7      # newest snapshot on or before the as-of date must be at most this old
  target_history_days: [7, 30]  # also show the mean target from snapshots this many days earlier
  recommendation_months: 4      # monthly rows of recommendation counts to show (0m, -1m, ...)
  # As-of date with no usable snapshot (e.g. before the collector started): take the monthly counts from
  # the earliest LATER snapshot, keeping only months that ended before the as-of month. Price targets are
  # never reconstructed. false = show nothing for such dates.
  reconstruct_backdated_recommendations: true
  max_reconstruct_months: 3     # Yahoo returns 0m to -3m, so 3 is the furthest back this can reach
  rating_change_lookback_days: 120
  max_rating_changes: 10
  # Web-research backfill (data/analyst/backfill/, made once by hand): a broker-panel reconstruction of the
  # weeks before the collector started. Used only for dates with no Yahoo snapshot, labelled as
  # reconstructed in the briefing, and never compared with Yahoo snapshots in the target-trend lines.
  # Its dated rating changes are added to the list (marked [web]); Yahoo wins if both list a date + firm.
  backfill:
    enabled: true
    dir: data/analyst/backfill

# --------------------------------------------------------------------------------------------
# Memory: the agent's own earlier views, read from data/briefings/<CODE>/decisions.jsonl
#   mode: off    - no prior views (the baseline for an ablation)
#         last   - the most recent earlier view only, in detail
#         ledger - a table of the last max_prior_dates views + the most recent in detail + track record
# Only views with an as-of date BEFORE the briefing's date are used, so back-dated runs stay point-in-time.
# --------------------------------------------------------------------------------------------
memory:
  mode: ledger
  max_prior_dates: 3
  max_age_days: 60              # ignore views older than this
  share_across_profiles: false  # false = a profile only sees views produced under the same profile
  show_track_record: true       # hit rate and Brier score of completed earlier calls vs the base rates
  track_record_min_calls: 3     # hide the track record until this many calls have completed

# --------------------------------------------------------------------------------------------
# Decision gate, applied by `ingest` to the agent's answer. The agent's own action is kept as
# action_model; action_final is what the pipeline acts on. The agent is NOT told about the gate,
# so it does not bend its probabilities to pass it.
# --------------------------------------------------------------------------------------------
decision:
  min_confidence: 0.45          # top bucket probability below this -> fallback_action
  min_margin: 0.05              # top minus second bucket below this -> fallback_action
  fallback_action: HOLD
  prob_sum_tolerance: 0.03      # warn (and renormalise) when p_buy + p_hold + p_sell is further from 1

# --------------------------------------------------------------------------------------------
# Known events inside the horizon, per stock code (added to the estimated results date, if any).
# --------------------------------------------------------------------------------------------
events: {}
#  D05:
#    - "2026-11-06: 3Q26 results (confirmed on SGXNet)"

output:
  dir: data/briefings           # briefings, meta, replies and decisions.jsonl go in <dir>/<CODE>/
  include_instructions: true    # false = data only (instructions kept in a Claude Project instead)

# --------------------------------------------------------------------------------------------
# Per-stock overrides
# --------------------------------------------------------------------------------------------
overrides: {}
#  S58:
#    label: {band_pct: 4.0}

# --------------------------------------------------------------------------------------------
# Experiment profiles (--profile <name>); the profile name goes into the file names and the ledger.
# --------------------------------------------------------------------------------------------
profiles:
  no_memory:                    # baseline for measuring what memory adds
    memory: {mode: "off"}       # quoted: a bare off is read by YAML as false
  high_only:                    # only high-materiality news as evidence
    news: {min_materiality: high, context_list: {min_materiality: medium}}
  strict_tags:                  # only tags the tagger was sure of, with a verified quote
    news: {min_tag_confidence: 0.75, require_evidence_verified: true}
  wide_news:                    # everything about the company, including low-materiality items
    news: {min_materiality: low, require_relevant_flag: false, max_items: 40}
  no_analyst:                   # baseline for measuring what the analyst consensus adds
    analyst: {enabled: false}
  no_backfill:                  # Yahoo snapshots only; reconstructed panel data left out
    analyst: {backfill: {enabled: false}}
  cautious:                     # act only on clear calls
    decision: {min_confidence: 0.55, min_margin: 0.15}
