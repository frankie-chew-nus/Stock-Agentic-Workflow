# KPI set: property developers and real-estate managers. DRAFT - not yet test-run.
kpi_set: property
label: Property developers
draft: true

columns:
  - {name: "revenue_{ccy}_m", unit: ccy_m, kind: flow, range: [1, 50000], def: "Revenue for the period."}
  - {name: "patmi_{ccy}_m", unit: ccy_m, kind: flow, range: [-10000, 20000], def: "Profit after tax and minority interests (net profit attributable to shareholders)."}
  - {name: "revaluation_gains_{ccy}_m", unit: ccy_m, kind: flow, range: [-20000, 20000], def: "Fair-value / revaluation gains (losses negative) recognised in the period."}
  - {name: "core_patmi_{ccy}_m", unit: ccy_m, kind: flow, range: [-10000, 20000], def: "PATMI excluding revaluation and one-offs, as the company reports it (its label in source); blank if not reported."}
  - {name: "development_sales_{ccy}_m", unit: ccy_m, kind: flow, range: [0, 50000], def: "Value of residential / development units sold in the period."}
  - {name: "development_sales_units", unit: count, kind: flow, range: [0, 100000], def: "Number of development units sold in the period."}
  - {name: "unbilled_sales_{ccy}_m", unit: ccy_m, kind: stock, range: [0, 100000], def: "Unbilled / unrecognised sales (progress billings to come) at period end."}
  - {name: "landbank_sqm_k", unit: x, kind: stock, range: [0, 100000], def: "Landbank in thousands of square metres of gross floor area, as reported (state the unit used in source)."}
  - {name: "net_gearing_x", unit: x, kind: ratio, range: [-5, 10], def: "Net debt / total equity as a multiple."}
  - {name: "nav_per_share_{ccy}", unit: ccy, kind: per_share, range: [0, 100], def: "NAV (or RNAV, say which in source) per share at period end."}
  - {name: "dps_{ccy}", unit: ccy, kind: per_share, range: [0, 10], def: "Ordinary dividend per share declared for this period. 0 if none."}
  - {name: "special_dps_{ccy}", unit: ccy, kind: per_share, range: [0, 10], def: "Special dividend per share declared for this period. 0 if none."}

checks: []
notes:
  - "Most SGX developers report half-yearly: use 1HYY / 2HYY labels."
