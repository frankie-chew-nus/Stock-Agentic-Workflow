# KPI set: banks (D05, O39, U11). Fixed CSV columns for build_fundamentals_prompt.py and the
# code-side checks run by run_fundamentals_extraction.py.
#
# Column fields:
#   name    snake_case; {ccy} becomes the company's reporting currency in lower case (sgd, usd ...)
#   unit    ccy_m (millions of reporting currency) | pct | bp | ccy (per share) | x | count | text
#   kind    flow (income-statement item for the period) | stock (balance at period end) | ratio | per_share
#   def     definition shown to the model - one sentence, the tie-breaker when banks label things differently
#   range   [min, max] plausibility range; a value outside it is flagged (usually a unit slip)
# Checks (expr may use any numeric column name; missing values skip the check):
#   target + tol_abs / tol_rel   expr must match the target column within the tolerance
#   min / max                    expr must stay inside the bound
kpi_set: banks
label: Banks
draft: false

columns:
  - {name: "total_income_{ccy}_m", unit: ccy_m, kind: flow, range: [100, 20000],
     def: "Total income = net interest income + non-interest income, group, for the period."}
  - {name: "nii_{ccy}_m", unit: ccy_m, kind: flow, range: [50, 15000],
     def: "Net interest income, group."}
  - {name: "nim_pct", unit: pct, kind: ratio, range: [0.5, 4.0],
     def: "Net interest margin, group, as reported for the period (annualised). Not a segment or 'commercial book' NIM."}
  - {name: "net_fee_income_{ccy}_m", unit: ccy_m, kind: flow, range: [10, 5000],
     def: "Net fee and commission income."}
  - {name: "wm_fees_{ccy}_m", unit: ccy_m, kind: flow, range: [1, 5000],
     def: "Wealth management fees as the bank reports them. If the bank only reports a broader 'wealth management income' (e.g. including insurance or treasury products), use that and name the label in source."}
  - {name: "expenses_{ccy}_m", unit: ccy_m, kind: flow, range: [50, 10000],
     def: "Total operating expenses."}
  - {name: "profit_before_allowances_{ccy}_m", unit: ccy_m, kind: flow, range: [10, 15000],
     def: "Profit before allowances (total income minus expenses; some banks call it operating profit), before share of associates."}
  - {name: "total_allowances_{ccy}_m", unit: ccy_m, kind: flow, range: [-2000, 5000],
     def: "Total allowances for credit and other losses charged in the period (specific + general). Positive = charge, negative = net write-back."}
  - {name: "sp_bp", unit: bp, kind: ratio, range: [-50, 200],
     def: "Specific allowances (or specific credit costs) on loans in basis points of average loans, annualised, as reported."}
  - {name: "credit_cost_bp", unit: bp, kind: ratio, range: [-50, 300],
     def: "Total credit costs on loans in basis points of average loans, annualised, as reported. Blank if the bank does not report a total figure."}
  - {name: "net_profit_{ccy}_m", unit: ccy_m, kind: flow, range: [-2000, 10000],
     def: "Net profit attributable to shareholders (PATMI) as reported. If the bank headlines a figure excluding one-offs, still use reported net profit and mention the one-off in source."}
  - {name: "roe_pct", unit: pct, kind: ratio, range: [0, 30],
     def: "Return on (ordinary shareholders') equity, annualised, as reported."}
  - {name: "cost_income_pct", unit: pct, kind: ratio, range: [20, 80],
     def: "Cost-to-income ratio as reported."}
  - {name: "npl_pct", unit: pct, kind: ratio, range: [0, 10],
     def: "Non-performing loan (NPL) ratio at period end."}
  - {name: "allowance_coverage_pct", unit: pct, kind: ratio, range: [30, 500],
     def: "Total allowances as % of non-performing assets (or of NPLs if that is the bank's measure), as reported."}
  - {name: "cet1_pct", unit: pct, kind: ratio, range: [8, 25],
     def: "Common Equity Tier 1 ratio, group, the headline figure the bank reports (if it shows both transitional and fully phased-in, use the headline one and say which in source)."}
  - {name: "customer_loans_{ccy}_m", unit: ccy_m, kind: stock, range: [10000, 2000000],
     def: "NET loans to customers (after allowances) at period end - the figure banks report every quarter, including 1Q/3Q trading updates. Do not use gross loans, even when both are shown; you may mention gross in source."}
  - {name: "customer_deposits_{ccy}_m", unit: ccy_m, kind: stock, range: [10000, 2500000],
     def: "Deposits of non-bank customers at period end."}
  - {name: "ldr_pct", unit: pct, kind: ratio, range: [40, 130],
     def: "Loan-to-deposit ratio as reported. Blank if not reported."}
  - {name: "div_ordinary_{ccy}", unit: ccy, kind: per_share, range: [0, 5],
     def: "Ordinary dividend per share declared for this period (interim, final or quarterly). 0 if the company declared none for this period."}
  - {name: "div_special_{ccy}", unit: ccy, kind: per_share, range: [0, 5],
     def: "Special dividend per share declared for this period. 0 if none."}
  - {name: "div_capital_return_{ccy}", unit: ccy, kind: per_share, range: [0, 5],
     def: "Capital-return dividend per share declared for this period (a separate payout some banks announced alongside ordinary dividends). 0 if none."}

checks:
  - name: cost_income_ratio
    expr: "expenses_{ccy}_m / total_income_{ccy}_m * 100"
    target: cost_income_pct
    tol_abs: 0.6
  - name: profit_before_allowances
    expr: "total_income_{ccy}_m - expenses_{ccy}_m"
    target: "profit_before_allowances_{ccy}_m"
    tol_rel: 0.02
  - name: income_components
    expr: "total_income_{ccy}_m - nii_{ccy}_m - net_fee_income_{ccy}_m"
    min: -2            # NII + fees cannot exceed total income (2m rounding slack)
  - name: loan_deposit_ratio
    expr: "customer_loans_{ccy}_m / customer_deposits_{ccy}_m * 100"
    target: ldr_pct
    tol_abs: 5         # loose: banks differ on gross vs net loans and which deposits count

# Notes added to the prompt for every bank.
notes:
  - "Banks report a quarter's figures in that quarter's own results; 4Q is usually shown next to the full-year figures. Use the quarter column, not the year-to-date or full-year column."
  - "1Q and 3Q are often a shorter trading update or business update with fewer figures. Leave KPIs that are not in it blank; do not fill them from the half-year or full-year report."
  - "Ratios such as NIM, ROE and credit costs are annualised by the bank; use them as printed, do not re-annualise."
