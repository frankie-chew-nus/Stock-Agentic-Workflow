# Fundamentals profile: U11 - UOB. Layer 3 of 3 (base -> KPI set -> company).
# Drafted by Claude 2026-10-23 from UOB's investor page. URL templates were checked against the links
# for the periods in `verified_for`; other periods are the same pattern, unchecked. UOB has renamed
# files over the years (cfo-presentation-1q-2023.pdf vs cfo-slides-1q-2026.pdf), so both are listed.
# Updated 2026-10-23 after the 1Q24-4Q25 backfill: the templates below hold from 3Q24 onwards; earlier
# 2024 files use other names, listed in known_documents at the end. The same files are also served
# under www.uobgroup.com (same path), and UOB files them on SGXNet.
code: U11
reporting:
  cadence: quarterly
  fiscal_year_end_month: 12
  currency: SGD
  report_lag_days: 40

source_domains: [uob.com.sg, uobgroup.com]

ir_pages:
  - url: https://www.uob.com.sg/investor-relations/financial/index.html
    note: results documents per period (1H26/2Q26 at the top when checked on 2026-10-23)

doc_url_templates:
  - doc: news release (2Q / 4Q)
    quarters: [2, 4]
    url: "https://www.uob.com.sg/investor-relations/assets/pdfs/investor/financial/{yyyy}/news-release-{q}q-{yyyy}.pdf"
    attach: true
    verified_for: [2Q25, 4Q25, 2Q26]        # 2024: see known_documents
  - doc: performance highlights (1Q / 3Q trading update)
    quarters: [1, 3]
    url: "https://www.uob.com.sg/investor-relations/assets/pdfs/investor/financial/{yyyy}/performance-highlights-{q}q-{yyyy}.pdf"
    attach: true
    verified_for: [3Q24, 3Q25, 1Q26]        # 1Q24, 1Q25: see known_documents
  - doc: CFO slides
    url: "https://www.uob.com.sg/investor-relations/assets/pdfs/investor/financial/{yyyy}/cfo-slides-{q}q-{yyyy}.pdf"
    attach: true
    verified_for: [3Q24, 4Q24, 3Q25, 4Q25, 1Q26, 2Q26]   # 1Q24, 2Q24, 1Q25, 2Q25: see known_documents
  - doc: CFO presentation (older file name)
    url: "https://www.uob.com.sg/investor-relations/assets/pdfs/investor/financial/{yyyy}/cfo-presentation-{q}q-{yyyy}.pdf"
    attach: true
    verified_for: [1Q21, 1Q23]
  - doc: condensed financial statements (2Q / 4Q, half-year and full-year statements)
    quarters: [2, 4]
    url: "https://www.uob.com.sg/investor-relations/assets/pdfs/investor/financial/{yyyy}/condensed-financial-statements-{q}q-{yyyy}.pdf"
    attach: false
    verified_for: [4Q25, 2Q26]              # 2Q24: see known_documents

preferred_documents:
  - "2Q and 4Q: the news release (quarter figures and guidance) and the CFO slides (NIM, credit costs, NPL, CET1, loans, deposits by quarter)."
  - "1Q and 3Q: UOB publishes a trading update - the performance highlights and CFO slides. Several KPIs may not be given; leave them blank."
  - "Guidance: the news release or performance highlights first, then the CEO / CFO slides."

company_notes:
  - "UOB pays an interim dividend with 1H results and a final dividend with FY results: put them on the 2Q and 4Q rows. 1Q and 3Q rows get 0 unless a special dividend was declared."
  - "UOB Kay Hian (SGX: U10) is a different company - ignore its research notes."
  - "UOB states credit costs on loans in bp; use that for credit_cost_bp and use the specific-allowance figure for sp_bp only if UOB gives it separately."
  - "UOB has changed file names several times (e.g. performance-highlights-q1-2024.pdf, newsrelease-4q-2024-results.pdf). If a candidate URL fails, open the investor page or search site:uob.com.sg / site:uobgroup.com / site:links.sgx.com for that period."
  - "Take wealth fees, specific credit costs, net loans and deposits only from text or tables. The CFO-slide charts do not read reliably as text (chart values came out inconsistent in testing), so leave a cell blank rather than reading it off a chart."
  - "In 2024 UOB headlined 'core' figures excluding one-off Citi integration expenses: use reported net profit, and say in source when expenses, cost/income or ROE are core figures."

extra_columns: []
# Reference only (not put into prompts): results documents whose names do not follow the templates,
# confirmed on 2026-10-23. Use these for re-runs of these periods (e.g. docs mode by hand).
known_documents:
  1Q24:
    - "https://uob.com.sg/investor-relations/assets/pdfs/investor/financial/2024/performance-highlights-q1-2024.pdf"
    - "https://uob.com.sg/investor-relations/assets/pdfs/investor/financial/2024/cfo-slides-q1-2024.pdf"
  2Q24:
    - "https://links.sgx.com/1.0.0/corporate-announcements/N68LFQF5DOU1GL0Z/813821_2Q24%20News%20Release.pdf"
    - "https://uob.com.sg/investor-relations/assets/pdfs/investor/financial/2024/cfo-slides-q2-2024.pdf"
    - "https://www.uob.com.sg/investor-relations/assets/pdfs/investor/financial/2024/condensed-financial-statement-2q-2024-results.pdf"
  4Q24:
    - "https://uob.com.sg/investor-relations/assets/pdfs/investor/financial/2024/newsrelease-4q-2024-results.pdf"
  1Q25:
    - "https://links.sgx.com/1.0.0/corporate-announcements/ELJUXTQO8OUGKBFZ/844571_1Q25%20Performance%20Highlights.pdf"
    - "https://links.sgx.com/1.0.0/corporate-announcements/ELJUXTQO8OUGKBFZ/844573_1Q25%20CFO%20Slides.pdf"
  2Q25:
    - "https://links.sgx.com/1.0.0/corporate-announcements/RPUUZ3K1BNIMX3A6/854559_1H25%20CFO%20Slides.pdf"

as_of: 2026-10-23
verified: false
sources:
