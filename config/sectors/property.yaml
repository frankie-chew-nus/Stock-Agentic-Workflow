# Sector: property developers & real-estate managers (U14, C09, 9CI, H78).
sector: property
label: Property developers and real-estate managers
trusted_domains: [ura.gov.sg, edgeprop.sg]
buckets:
  a: "Results and guidance: revenue, earnings, development sales, residential launch take-up, hotel performance, fee income and assets under management, revaluations, dividends, outlook"
  b: "Legal and regulatory: URA rules and cooling measures, lawsuits, boardroom disputes, regulatory reviews"
  d: "Strategy and deals: land bids and acquisitions, divestments, fund launches, joint ventures, privatisations, buybacks"
  f: "Operations: residential launches, hotels, office and retail portfolios, fund management platforms"
  g: "Sector stories: Singapore and regional property markets, private home prices, government land sales, interest rates, Hong Kong and China property, where {short_name} is discussed in its own right"
not_relevant_patterns:
  - "A {short_name} building, hotel or project is named only as a location or landmark, with nothing about the company's business."
relevant_examples:
  - "land bids, launches and sales results"
  - "boardroom and governance disputes"
