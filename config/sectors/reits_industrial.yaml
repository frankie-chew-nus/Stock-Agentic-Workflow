# Sector: industrial, logistics & data-centre S-REITs (A17U, M44U, ME8U, BUOU, AJBU).
sector: reits_industrial
label: Singapore industrial, logistics and data-centre REITs
trusted_domains: [jtc.gov.sg, datacenterdynamics.com]
buckets:
  a: "Results and guidance: distribution per unit (DPU), net property income, occupancy, rental reversions, lease expiry profile, valuations, NAV per unit, outlook"
  b: "Legal and regulatory: MAS REIT rules (leverage limits, interest coverage), JTC lease terms, tenant disputes, lawsuits, property incidents"
  c: "Leadership and governance: REIT manager CEO and board changes, sponsor changes, management fees, executive comments on {short_name}'s own portfolio"
  d: "Strategy and deals: property acquisitions and divestments, sponsor injections, developments and redevelopments, mergers, unit buybacks"
  e: "Credit and capital: aggregate leverage, interest coverage, cost of debt, refinancing, green loans or bonds, equity fund raising, rating actions"
  f: "Operations and properties: warehouses, business parks, factories and data centres, tenant wins and losses, development pipeline, data-centre power and cooling"
  g: "Sector stories: logistics and industrial property demand, e-commerce, data-centre and AI demand, JTC industrial supply, interest rates and S-REIT valuations"
  h: "Primary sources: SGX announcements, the REIT manager's investor relations and newsroom pages, MAS statements, rating agency releases"
not_relevant_patterns:
  - "A {short_name} property is named only as the location of an event or incident, with nothing about the REIT's business."
relevant_examples:
  - "DPU, occupancy and valuation updates"
  - "property acquisitions and divestments"
  - "leverage, refinancing and fund raising"
