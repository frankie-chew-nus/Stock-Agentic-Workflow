name: Mock config offline E2E
on:
  push:
    branches: [security/mock-config-e2e]
  pull_request:
    branches: [main]
jobs:
  offline-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy openpyxl pyyaml jinja2
      - run: python -m unittest discover -s tests -v
