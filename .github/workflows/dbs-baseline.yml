name: DBS offline baseline
on:
  push:
    branches: [baseline-dbs-e2e]
  pull_request:
    branches: [main]
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install briefing dependencies
        run: python -m pip install pandas numpy openpyxl pyyaml jinja2
      - name: Offline baseline and integration checks
        run: python -m unittest discover -s tests -v
